version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./salespulse.db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    volumes:
      - .:/app
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    depends_on:
      - backend
